# DEPLOY NO EASYPANEL QUANDO A IMAGEM NOVA DA MAIN FICA PRONTA.
#
# A VPS não constrói o app: o `next build` lá morre por falta de memória
# (exit 137). Quem constrói é o workflow "Publicar imagem Docker (GHCR)", que
# publica `ghcr.io/<dono>/deskcommcrm:main`; o EasyPanel só puxa essa imagem.
# Por isso este workflow espera aquele terminar com sucesso — disparar no push
# faria o EasyPanel puxar a imagem anterior.
#
# Chama o "Gatilho de Implantação" do serviço no EasyPanel (Implantações ›
# Gatilho de Implantação), o mesmo que o botão "Implantar".
#
# A URL do gatilho NÃO entra neste arquivo: quem tem a URL faz deploy. Ela fica
# no segredo `EASYPANEL_DEPLOY_URL` do repositório (Settings › Secrets and
# variables › Actions). Sem o segredo, o job termina sem chamar nada — fork que
# herdar este arquivo não dispara deploy em lugar nenhum.
#
# Para disparar à mão: aba Actions › deploy-easypanel › Run workflow.
name: deploy-easypanel

on:
  workflow_run:
    workflows: ["Publicar imagem Docker (GHCR)"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch: {}

# Duas imagens seguidas não disputam o mesmo deploy: a mais nova cancela o que
# ainda está esperando.
concurrency:
  group: deploy-easypanel
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    # Só imagem publicada a partir de push na main (PR também roda o workflow
    # da imagem, mas não publica nada).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o gatilho de implantação
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::warning::Segredo EASYPANEL_DEPLOY_URL não configurado — nada a fazer."
            exit 0
          fi
          status=$(curl -sS -o resposta.txt -w '%{http_code}' --max-time 60 -X POST "$DEPLOY_URL")
          echo "EasyPanel respondeu HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::O EasyPanel recusou o deploy (HTTP $status)."
            head -c 500 resposta.txt
            exit 1
          fi
          echo "Deploy de ${SHA::7} pedido ao EasyPanel."
